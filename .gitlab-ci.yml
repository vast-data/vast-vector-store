# GitLab CI/CD Pipeline for langchain-vastdb
# Stages: lint, test (Python matrix), integration-test, publish (PyPI)

# Prevent duplicate pipelines: run on MR events and non-MR pushes to the
# default branch only. Tag pushes are excluded until story 4-3 introduces
# the publish job (otherwise GitLab would fail with "no jobs in pipeline").

include:
  - project: 'devops/ci-templates'
    ref: 'main'
    file: 'templates/external-repo.gitlab-ci.yml'


workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE != "merge_request_event"
    - if: $CI_COMMIT_TAG

variables:
  UV_VERSION: "0.7"
  PYTHON_VERSION: "3.12"
  BASE_LAYER: "bookworm-slim"
  UV_CACHE_DIR: ".uv-cache"
  UV_LINK_MODE: "copy"

stages:
  - lint
  - test
  - integration-test
  - security
  - sync
  - publish

# -- Lint job: ruff check on a single Python version --
lint:
  stage: lint
  image: ghcr.io/astral-sh/uv:${UV_VERSION}-python${PYTHON_VERSION}-${BASE_LAYER}
  tags:
    - vast-dev-builder
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - when: on_success
  cache:
    - key:
        files:
          - uv.lock
      paths:
        - ${UV_CACHE_DIR}
  script:
    - uv sync --locked
    - uv run ruff check .
  after_script:
    - uv cache prune --ci

# -- Unit tests: Python version matrix --
unit-test:
  stage: test
  image: ghcr.io/astral-sh/uv:${UV_VERSION}-python${PYTHON_VERSION}-${BASE_LAYER}
  tags:
    - vast-dev-builder
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - when: on_success
  parallel:
    matrix:
      - PYTHON_VERSION: ["3.10", "3.11", "3.12", "3.13"]
  cache:
    - key:
        prefix: py${PYTHON_VERSION}
        files:
          - uv.lock
      paths:
        - ${UV_CACHE_DIR}
  # TODO: remove allow_failure after Story 2.5 adds unit tests
  allow_failure: true
  script:
    - uv sync --locked
    - uv run pytest tests/unit_tests/ -v --junitxml=report.xml
  after_script:
    - uv cache prune --ci
  artifacts:
    when: always
    reports:
      junit: report.xml

# -- Integration tests: real VAST cluster --
integration-test:
  stage: integration-test
  image: ghcr.io/astral-sh/uv:${UV_VERSION}-python${PYTHON_VERSION}-${BASE_LAYER}
  tags:
    - vast-dev-builder
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - when: on_success
  cache:
    - key:
        files:
          - uv.lock
      paths:
        - ${UV_CACHE_DIR}
  script:
    - apt-get update -qq && apt-get install -y -qq sshpass=1.09-1+b1
    - uv sync --locked
    # SSH tunnel + tests in one shell so the exported env var is visible to pytest.
    - |
      bash scripts/ci-tunnel.sh
      export AWS_S3_ENDPOINT_URL="https://localhost:18151"
      uv run pytest tests/integration_tests/ -v -rs --log-cli-level=WARNING --junitxml=report.xml
  after_script:
    - uv cache prune --ci
  artifacts:
    when: always
    reports:
      junit: report.xml
  # Required CI/CD variables (Settings → CI/CD → Variables):
  #   AWS_S3_ENDPOINT_URL   — cluster host:port (tunnel target), e.g. "172.27.151.2:443"
  #   VASTDB_SSH_JUMP_HOST      — SSH jump host IP/hostname, e.g. "10.141.200.151"
  #   VASTDB_ENDPOINT_USERNAME  — SSH username on the jump host, e.g. "vastdata"
  #   VASTDB_ENDPOINT_PASSWORD  — SSH password for the jump host (mark as Masked)
  #   AWS_ACCESS_KEY_ID         — S3-style access key
  #   AWS_SECRET_ACCESS_KEY     — S3-style secret key (mark as Masked)
  #   VASTDB_BUCKET             — bucket name, e.g. "omer-test-db"