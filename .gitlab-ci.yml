# GitLab CI/CD Pipeline for langchain-vastdb
# Stages: lint, test (Python matrix), integration-test, publish (PyPI)

# Prevent duplicate pipelines: run on MR events and non-MR pushes to the
# default branch only. Tag pushes trigger the publish job provided by the
# devops CI template (devops/ci-templates: templates/external-repo.gitlab-ci.yml).

include:
  - project: 'devops/ci-templates'
    ref: 'main'
    file: 'templates/external-repo.gitlab-ci.yml'

# Keep the included security scan on the existing AWS builder pool.
trufflehog-scan:
  tags:
    - vast-dev-builder

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE != "merge_request_event"
    - if: $CI_COMMIT_TAG

variables:
  UV_VERSION: "0.7"
  PYTHON_VERSION: "3.12"
  BASE_LAYER: "bookworm-slim"
  UV_CACHE_DIR: ".uv-cache"
  UV_LINK_MODE: "copy"

stages:
  - lint
  - test
  - integration-test
  - security
  - sync
  - publish

# -- Lint job: ruff check on a single Python version --
lint:
  stage: lint
  image: ghcr.io/astral-sh/uv:${UV_VERSION}-python${PYTHON_VERSION}-${BASE_LAYER}
  tags:
    - vast-dev-builder
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - when: on_success
  cache:
    - key:
        files:
          - uv.lock
      paths:
        - ${UV_CACHE_DIR}
  script:
    - uv sync --locked
    - uv run ruff check .
  after_script:
    - uv cache prune --ci

# -- Unit tests: Python version matrix --
unit-test:
  stage: test
  image: ghcr.io/astral-sh/uv:${UV_VERSION}-python${PYTHON_VERSION}-${BASE_LAYER}
  tags:
    - vast-dev-builder
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - when: on_success
  parallel:
    matrix:
      - PYTHON_VERSION: ["3.10", "3.11", "3.12", "3.13"]
  cache:
    - key:
        prefix: py${PYTHON_VERSION}
        files:
          - uv.lock
      paths:
        - ${UV_CACHE_DIR}
  script:
    - uv sync --locked
    - uv run pytest tests/unit_tests/ -v --junitxml=report.xml
  after_script:
    - uv cache prune --ci
  artifacts:
    when: always
    reports:
      junit: report.xml

# -- Integration tests: real VAST cluster --
integration-test:
  stage: integration-test
  image: ghcr.io/astral-sh/uv:${UV_VERSION}-python${PYTHON_VERSION}-${BASE_LAYER}
  tags:
    - v141-k8s
  # Preserve VAST keys before the runner's ECR bootstrap overwrites AWS variables.
  variables:
    VASTDB_CI_ACCESS_KEY_ID: "$AWS_ACCESS_KEY_ID"
    VASTDB_CI_SECRET_ACCESS_KEY: "$AWS_SECRET_ACCESS_KEY"
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - when: on_success
  cache:
    - key:
        files:
          - uv.lock
      paths:
        - ${UV_CACHE_DIR}
  script:
    - |
      export AWS_ACCESS_KEY_ID="$VASTDB_CI_ACCESS_KEY_ID"
      export AWS_SECRET_ACCESS_KEY="$VASTDB_CI_SECRET_ACCESS_KEY"
      : "${AWS_S3_ENDPOINT_URL:?AWS_S3_ENDPOINT_URL is required}"
      : "${AWS_ACCESS_KEY_ID:?AWS_ACCESS_KEY_ID is required}"
      : "${AWS_SECRET_ACCESS_KEY:?AWS_SECRET_ACCESS_KEY is required}"
      : "${VASTDB_BUCKET:?VASTDB_BUCKET is required}"
    - uv sync --locked
    - uv run pytest tests/integration_tests/ -v -rs --log-cli-level=WARNING --junitxml=report.xml
  after_script:
    - uv cache prune --ci
  artifacts:
    when: always
    reports:
      junit: report.xml
  # REST-backed tests use fallback search unless both ADBC variables are configured.
  # Required CI/CD variables (Settings → CI/CD → Variables):
  #   AWS_S3_ENDPOINT_URL   — direct cluster URL, e.g. "https://172.26.141.1:443"
  #   AWS_ACCESS_KEY_ID     — v141 S3-style access key (mark as Masked)
  #   AWS_SECRET_ACCESS_KEY — v141 S3-style secret key (mark as Masked)
  #   VASTDB_BUCKET         — bucket name, e.g. "vector-store-test-db"