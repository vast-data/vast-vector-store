# GitLab CI/CD Pipeline for langchain-vastdb
# Stages: lint, test (Python matrix), integration-test, publish (PyPI)

variables:
  UV_VERSION: "0.7"
  PYTHON_VERSION: "3.12"
  BASE_LAYER: "bookworm-slim"
  UV_CACHE_DIR: ".uv-cache"
  UV_LINK_MODE: "copy"

stages:
  - lint
  - test
  - integration-test
  - publish

# -- Lint job: ruff check on a single Python version --
lint:
  stage: lint
  image: ghcr.io/astral-sh/uv:${UV_VERSION}-python${PYTHON_VERSION}-${BASE_LAYER}
  tags:
    - vast-dev-builder
  cache:
    - key:
        files:
          - uv.lock
      paths:
        - ${UV_CACHE_DIR}
  script:
    - uv sync --locked
    - uv run ruff check .
  after_script:
    - uv cache prune --ci

# -- Unit tests: Python version matrix --
unit-test:
  stage: test
  image: ghcr.io/astral-sh/uv:${UV_VERSION}-python${PYTHON_VERSION}-${BASE_LAYER}
  tags:
    - vast-dev-builder
  parallel:
    matrix:
      - PYTHON_VERSION: ["3.10", "3.11", "3.12", "3.13"]
  cache:
    - key:
        prefix: py${PYTHON_VERSION}
        files:
          - uv.lock
      paths:
        - ${UV_CACHE_DIR}
  # TODO: remove allow_failure after Story 2.5 adds unit tests
  allow_failure: true
  script:
    - uv sync --locked
    - uv run pytest tests/unit_tests/ -v
  after_script:
    - uv cache prune --ci

# -- Integration tests: real VAST cluster --
integration-test:
  stage: integration-test
  image: ghcr.io/astral-sh/uv:${UV_VERSION}-python${PYTHON_VERSION}-${BASE_LAYER}
  tags:
    - vast-dev-builder
  cache:
    - key:
        files:
          - uv.lock
      paths:
        - ${UV_CACHE_DIR}
  script:
    - uv sync --locked
    # Download the ADBC native driver from Artifactory and expose it to the test
    # process so VastDB can use native vector search when the cluster supports it.
    # Falls back gracefully to in-memory L2Sq when ADBC is unavailable or the
    # table has no vector index (current behaviour on VAST 5.4/5.5).
    - |
      ADBC_SO=/tmp/libadbc_driver_vastdb.so
      LATEST_BUILD=$(curl -fsSL https://artifactory.vastdata.com/artifactory/files/vastdb-native-client/ \
        | grep -o 'href="[0-9]*/"' | grep -o '[0-9]*' | sort -n | tail -1)
      echo "Downloading ADBC driver from build ${LATEST_BUILD}"
      curl -fsSL \
        "https://artifactory.vastdata.com/artifactory/files/vastdb-native-client/${LATEST_BUILD}/libadbc_driver_vastdb.so" \
        -o "${ADBC_SO}" && export VASTDB__ADBC_DRIVER_PATH="${ADBC_SO}" \
        || echo "ADBC driver download failed — vector search will use in-memory fallback"
    - uv run pytest tests/integration_tests/ -v
  after_script:
    - uv cache prune --ci
  # Required CI/CD variables (Settings → CI/CD → Variables):
  #   VASTDB__ENDPOINT      — HTTP endpoint reachable from the runner, e.g. https://10.x.x.x:8080
  #                           (not localhost — the runner is a separate machine)
  #   VASTDB__ACCESS_KEY    — S3-style access key
  #   VASTDB__SECRET_KEY    — S3-style secret key  (mark as Masked)
  #   VASTDB__BUCKET        — bucket name, e.g. "omer-test-db"
  #
  # Optional — enables native ADBC vector search via array_distance() SQL:
  #   VASTDB__ADBC_ENDPOINT — QueryEngine hostname/IP, e.g. "172.27.74.17"
  #                           (separate from the HTTP endpoint; see cluster.env)
  #
  # The ADBC .so is downloaded automatically from Artifactory (see script above).
  # If VASTDB__ADBC_ENDPOINT is not set, vector search falls back to in-memory L2Sq.

# -- Publish to PyPI: only on version tags --
# NOTE: Before first publish, register this project as a trusted publisher
# on PyPI at https://pypi.org/manage/account/publishing/
# Link it to this GitLab project's path, environment, and tag pattern.
publish:
  stage: publish
  image: ghcr.io/astral-sh/uv:${UV_VERSION}-python${PYTHON_VERSION}-${BASE_LAYER}
  tags:
    - vast-dev-builder
  id_tokens:
    PYPI_ID_TOKEN:
      aud: pypi
  rules:
    - if: $CI_COMMIT_TAG =~ /^v/
  script:
    - uv build
    - uv publish --token $PYPI_ID_TOKEN
