# GitLab CI/CD Pipeline for langchain-vastdb
# Stages: lint, test (Python matrix), integration-test, publish (PyPI)

variables:
  UV_VERSION: "0.7"
  PYTHON_VERSION: "3.12"
  BASE_LAYER: "bookworm-slim"
  UV_CACHE_DIR: ".uv-cache"
  UV_LINK_MODE: "copy"

stages:
  - lint
  - test
  - integration-test
  - publish

# -- Lint job: ruff check on a single Python version --
lint:
  stage: lint
  image: ghcr.io/astral-sh/uv:${UV_VERSION}-python${PYTHON_VERSION}-${BASE_LAYER}
  cache:
    - key:
        files:
          - uv.lock
      paths:
        - ${UV_CACHE_DIR}
  script:
    - uv sync --locked
    - uv run ruff check .
  after_script:
    - uv cache prune --ci

# -- Unit tests: Python version matrix --
unit-test:
  stage: test
  image: ghcr.io/astral-sh/uv:${UV_VERSION}-python${PYTHON_VERSION}-${BASE_LAYER}
  parallel:
    matrix:
      - PYTHON_VERSION: ["3.10", "3.11", "3.12", "3.13"]
  cache:
    - key:
        files:
          - uv.lock
      paths:
        - ${UV_CACHE_DIR}
  script:
    - uv sync --locked
    - uv run pytest tests/unit_tests/ -v
  after_script:
    - uv cache prune --ci

# -- Integration tests: real VAST cluster --
integration-test:
  stage: integration-test
  image: ghcr.io/astral-sh/uv:${UV_VERSION}-python${PYTHON_VERSION}-${BASE_LAYER}
  # TODO: remove allow_failure after Story 3.1 implements integration tests
  allow_failure: true
  cache:
    - key:
        files:
          - uv.lock
      paths:
        - ${UV_CACHE_DIR}
  script:
    - uv sync --locked
    - uv run pytest tests/integration_tests/ -v
  after_script:
    - uv cache prune --ci
  # These variables must be set at the GitLab project level:
  # VASTDB_ENDPOINT, VASTDB_ACCESS_KEY, VASTDB_SECRET_KEY,
  # VASTDB_TEST_BUCKET, VASTDB_TEST_SCHEMA
