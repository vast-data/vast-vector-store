version: '3'

dotenv: ['.env']

tasks:
  adbc:setup:
    desc: Download and verify Linux x86_64 ADBC driver (requires VASTDB_ADBC_DRIVER_PATH)
    cmds:
      - uv run python scripts/setup_adbc_driver.py

  test:integration:
    desc: Run integration tests against the live VAST cluster (reads creds from .env)
    cmds:
      - uv run pytest tests/integration_tests/ -v {{.CLI_ARGS}}

  test:unit:
    desc: Run unit tests (no cluster required)
    cmds:
      - uv run pytest tests/unit_tests/ -v {{.CLI_ARGS}}

  test:all:
    desc: Run all tests
    cmds:
      - uv run pytest tests/ -v {{.CLI_ARGS}}
